name: MD to One-Page PDF → GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pandoc + LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended

      - name: Convert Markdown to compact PDF
        run: |
          mkdir -p output
          for file in *.md; do
            [ -e "$file" ] || continue
            pandoc "$file" -o "output/${file%.md}.pdf" \
              --pdf-engine=xelatex \
              -V geometry:margin=0.4in \
              -V fontsize=9pt \
              -V linestretch=0.95 \
              -V pagestyle=empty
          done

      - name: Prepare gh-pages branch
        run: |
          mkdir gh-pages
          cp -r output/* gh-pages/

      - name: Deploy to gh-pages
        run: |
          cd gh-pages
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Update PDFs" || echo "No changes"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
