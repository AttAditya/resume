name: MD to PDF → GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output folder
        run: mkdir -p output

      - name: Convert MD to PDF
        run: |
          docker run --rm -v $PWD:/data pandoc/core:3.8 sh -c "
            for file in /data/*.md; do
              [ -e \"$file\" ] || continue
              pandoc \"$file\" -o \"/data/output/$(basename \"${file%.md}.pdf\")\"
            done
          "

      - name: Prepare gh-pages folder
        run: |
          mkdir gh-pages
          cp -r output/* gh-pages/

      - name: Deploy to gh-pages
        run: |
          cd gh-pages
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b gh-pages
          cp -r ../output/* .
          git add .
          git commit -m "Update PDFs" || echo "No changes"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
