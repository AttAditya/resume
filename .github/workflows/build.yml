name: MD → True One Page PDF → GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            fonts-dejavu

      - name: Create LaTeX wrapper template
        run: |
          cat << 'EOF' > onepage.tex
          \documentclass[10pt]{article}
          \usepackage[margin=0.3in]{geometry}
          \usepackage{adjustbox}
          \usepackage{fontspec}
          \setmainfont{DejaVu Sans}
          \pagestyle{empty}
          \setlength{\parindent}{0pt}

          \begin{document}
          \begin{adjustbox}{max totalsize={\textwidth}{\textheight},center}
          $body$
          \end{adjustbox}
          \end{document}
          EOF

      - name: Convert MD → ONE PAGE PDF
        run: |
          mkdir -p output

          for file in *.md; do
            [ -e "$file" ] || continue

            pandoc "$file" -o "output/${file%.md}.pdf" \
              --pdf-engine=xelatex \
              --template=onepage.tex \
              -V geometry:margin=0.3in
          done

      - name: Deploy to gh-pages
        run: |
          mkdir gh-pages
          cp -r output/* gh-pages/

          cd gh-pages
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Update PDFs" || echo "No changes"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
